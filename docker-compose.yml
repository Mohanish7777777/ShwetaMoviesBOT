version: '3.8'

services:
  python-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python_bot
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "bot.py"]
    ports:
      - "8000:8000" # Replace with the port your bot listens on, if applicable
    environment:
      - PYTHONUNBUFFERED=1
